const T=16,LW=220,GY=15; // tiles

function build(){tiles={};coins=[];enemies=[];cans=[];
 const set=(i,j,t)=>tiles[i+','+j]=t;

 for(let k=0;k<6;k++)for(let j=0;j<=k;j++)set(200+k,GY-1-j,'b');

 [[13,9],[29,8],[34,13],[45,9],[53,6],[67,9],[75,13],[79,7],[97,9],[109,7],[115,13],[121,9],[135,8],[141,5],[159,9],[173,7],[185,9],[192,13]].forEach((p,k)=>C(p[0],p[1],k%2?'v':'b'));

  if(e[1])enemies.push({x:e[0]*T,y:GY*T-18,w:30,h:18,vx:-30,t:'car',on:1});

let AC=null;function snd(f,d,type){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}

function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

 else if(o.vx<0){const i=Math.floor(o.x/T);for(let j=j0;j<=j1;j++)if(solid(i,j)){o.x=(i+1)*T;o.vx=0;return 1;}}return 0;}
function moveY(o){const i0=Math.floor(o.x/T),i1=Math.floor((o.x+o.w-1)/T);o.on=0;
 if(o.vy>0){const j=Math.floor((o.y+o.h)/T);for(let i=i0;i<=i1;i++)if(solid(i,j)){o.y=j*T-o.h;o.vy=0;o.on=1;return;}}
 else if(o.vy<0){const j=Math.floor(o.y/T);for(let i=i0;i<=i1;i++){const t=solid(i,j);if(t){o.y=(j+1)*T;o.vy=0;if(t==='q'&&o===P){tiles[i+','+j]='u';score+=100;pops.push({x:i*T+8,y:j*T-4,s:'+100 €',t:1});snd(880,.15);}return;}}}}
function die(){sup=0;lives--;snd(150,.4,'sawtooth');if(lives<=0){state='over';saveBest();}else reset(false);}
function saveBest(){if(score>best){best=score;try{localStorage.setItem('citeBest',best);}catch(e){}}}
function update(dt){if(state!=='play')return;inv=Math.max(0,inv-dt);sup=Math.max(0,sup-dt);
 const L=keys.l||tk.L,R=keys.r||tk.R,J=keys.j||tk.J;
 const acc=600,max=110;if(L){P.vx=Math.max(P.vx-acc*dt,-max);P.f=-1;}else if(R){P.vx=Math.min(P.vx+acc*dt,max);P.f=1;}else P.vx*=Math.pow(.0005,dt);
 if(J&&P.on&&!P.jh){P.vy=-330;P.jh=1;snd(520,.12);}if(!J){P.jh=0;if(P.vy<-120)P.vy=-120;}

 for(const c of coins)if(c.on&&hit(P,{x:c.x,y:c.y,w:10,h:14})){c.on=0;const v=c.t==='b'?200:50;score+=v;if(c.t!=='b'){sup=30;pops.push({x:c.x,y:c.y-10,s:'INVINCIBLE !',t:1.2});snd(1500,.3,'triangle');}pops.push({x:c.x,y:c.y,s:'+'+v,t:1});snd(c.t==='b'?1200:900,.1);}

  if(hit(P,e)){if(P.vy>0&&P.y+P.h-e.y<10){const v=e.t==='car'?150:100;e.on=0;squash.push({e:e,t:.4});P.vy=-250;score+=v;pops.push({x:e.x,y:e.y,s:'+'+v,t:1});snd(e.t==='car'?300:420,.2);}
   else if(sup>0){const v=e.t==='car'?150:100;e.on=0;squash.push({e:e,t:.4});score+=v;pops.push({x:e.x,y:e.y,s:'BOUM +'+v,t:1});snd(200,.15,'sawtooth');}
